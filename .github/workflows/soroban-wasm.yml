name: Soroban Contracts CI

on:
  push:
    paths:
      - 'pi-contracts/**'
  pull_request:
    paths:
      - 'pi-contracts/**'

jobs:
  build:
    name: Build, Test and Package Soroban Contracts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.72.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rustup@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown

      - name: Install cargo-soroban (or soroban-cli)
        run: |
          cargo install --locked cargo-soroban || true
          # If you prefer soroban-cli, uncomment the next line and comment the previous one:
          # cargo install --locked soroban-cli || true

      - name: Build contracts (tests + wasm)
        working-directory: pi-contracts
        run: |
          # Run unit tests
          cargo test --workspace --all --locked
          # Build release wasm artifacts for Soroban
          cargo build --release --target wasm32-unknown-unknown

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: pi-contracts/target/wasm32-unknown-unknown/release/**/*.wasm
