[package]
name = "be-well"
version = "1.0.0"
edition = "2021"
authors = ["Mayas Ali <mnee88000mias@gmail.com>"]
license = "MIT"
description = "Decentralized insurance platform for Pi Network"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "20.0.0", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true